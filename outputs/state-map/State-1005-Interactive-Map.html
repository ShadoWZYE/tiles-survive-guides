let locale='EN',view=[0,0,3200,2560],selected=null,drag=null,moved=false;
const stage=document.querySelector('#stage'),$=id=>document.getElementById(id),tr=(a,b)=>locale==='EN'?a:b;
function applyView(){stage.querySelector('svg').setAttribute('viewBox',view.join(' '))}
function init(){stage.innerHTML=DATA.svgs[locale];applyView();$('heading').textContent=tr('State 1005 · City capture plan','Штат 1005 · План захвата городов');$('fit').textContent=tr('Full state','Весь штат');$('locale').textContent=tr('Русский','English');$('level').options[0].textContent=tr('All city levels','Все уровни');$('search').placeholder=tr('Find 848:328 or city','Найти 848:328 или город');$('help').textContent=tr('Drag to pan · scroll to zoom · click a city or its region. Blue = planned VeD; purple = planned VAN; amber = planned ALL; green = rus; teal = ECL; coral = TCE; red hatching = contested claims; grey = unassigned. Plans are preloaded from your screenshots.','Перетаскивайте карту, используйте колесо для масштаба. Нажмите на город или регион. Синий — план VeD, фиолетовый — VAN, янтарный — ALL, зелёный — rus, бирюзовый — ECL, коралловый — TCE, красная штриховка — спорные заявки, серый — без заявки.');$('source').textContent=tr('S1/base layout, client 2.6.300.293. Exact region grid; diagram orientation matches the screenshots. These are alliance claims, except reported ownership of ECL at 668:828 and VAN at 328:188. No live ownership feed. Start from a Level 1 city and expand through connected regions; marker numbers are not a validated capture route. Bonuses can differ after merging or in other seasons.','Базовая карта S1, клиент 2.6.300.293. Точные границы из таблиц игры. Это заявки союзов; подтверждено владение ECL базой 668:828 и VAN фабрикой 328:188. Нет автоматического обновления владельцев. Начните с города 1-го уровня и расширяйтесь через смежные регионы; номера маркеров не задают маршрут. После слияния и в других сезонах бонусы могут отличаться.');$('targets').innerHTML='<h2>'+tr('Planned cities','Запланированные города')+'</h2>'+DATA.cities.filter(c=>c.plan).sort((a,b)=>Number(b.contested)-Number(a.contested)||({VeD:0,VAN:1,ALL:2,rus:3,ECL:4,TCE:5}[a.claims[0]]-{VeD:0,VAN:1,ALL:2,rus:3,ECL:4,TCE:5}[b.claims[0]])||(a.order||9)-(b.order||9)||b.level-a.level||a.x-b.x).map(c=>`<button class="target" data-id="${c.area_id}">${c.contested?'⚠ ':''}${c.plan}${c.order?' #'+c.order:''} · L${c.level} · ${c.x}:${c.y}</button>`).join('');$('targets').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.id,true));showDetail();filter();}
function showDetail(){const c=DATA.cities.find(c=>c.area_id===selected);if(!c){$('detail').innerHTML='<div class="ownership">'+tr('ECL captured Military Base 668:828. No contested regions.','ECL захватил военную базу 668:828. Спорных регионов нет.')+'</div><br><h2>'+tr('110 cities · 110 regions','110 городов · 110 регионов')+'</h2><p>'+tr('Choose a city to see its coordinates, bonus and stacking group. VeD targets keep the six screenshot order numbers.','Выберите город: координаты, бонус и группа суммирования. Номера VeD соответствуют шести маркерам на снимках.')+'</p>';return}const name=locale==='EN'?c.name:c.ru;$('detail').innerHTML=`<h2>L${c.level} · ${name}</h2><div class="coords">${c.x}:${c.y}</div><span class="pill ${c.contested?'contested':c.plan==='VAN'?'van':c.plan==='ALL'?'all':c.plan==='rus'?'rus':c.plan==='ECL'?'ecl':c.plan==='TCE'?'tce':''}">${c.plan?((c.contested?tr('Contested: ','Спорный: '):'')+c.plan+(c.order?' #'+c.order:'')):tr('Unassigned','Не распределён')}</span><p>${c.confirmed_owner?(tr('Confirmed owner: ','Подтвержденный владелец: ')+c.confirmed_owner+' · '+c.ownership_reported)+'<br>':''}${c.benefits.map(b=>`${locale==='EN'?b.en:b.ru} +${+(b.value*100).toFixed(3)}%`).join('<br>')}</p><dl><dt>${tr('Region','Регион')}</dt><dd>${c.area_code}</dd><dt>${tr('Buff group','Группа бонуса')}</dt><dd>${c.config_key}</dd><dt>${tr('Tiles','Клетки')}</dt><dd>${c.pieces*100}</dd></dl><p>${tr('These are per-city configured values, not guaranteed extra bonuses. The earlier panel for 908:508 and 908:768 displayed only +10% training combined (29 Oct, before reassignment). Different configuration groups do not guarantee stacking; server eligibility and active mapping remain unresolved.','Это значения отдельных конфигураций, а не гарантированные добавки. Прежняя панель для 908:508 и 908:768 показывала только +10% обучения суммарно (29.10, до передачи). Разные группы не гарантируют суммирование; серверные признаки активности и текущая конфигурация неизвестны.')}</p>`;}
function choose(id,focus=false){selected=id;showDetail();stage.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));stage.querySelectorAll(`[data-area="${id}"]`).forEach(e=>e.classList.add('selected'));if(focus){const c=DATA.cities.find(c=>c.area_id===id);const x=1600+(c.x-c.y)*1.16,y=2260-(c.x+c.y)*.77;view=[x-550,y-440,1100,880];applyView()}}
function filter(){const level=+$('level').value;stage.querySelectorAll('[data-level]').forEach(e=>e.classList.toggle('dim',level!==0&&+e.dataset.level!==level))}
function zoom(f,point){const w=Math.min(4200,Math.max(220,view[2]*f)),h=w*.8;const p=point||[view[0]+view[2]/2,view[1]+view[3]/2],rx=(p[0]-view[0])/view[2],ry=(p[1]-view[1])/view[3];view=[p[0]-w*rx,p[1]-h*ry,w,h];applyView()}
function localPoint(e){const svg=stage.querySelector('svg'),p=new DOMPoint(e.clientX,e.clientY);return p.matrixTransform(svg.getScreenCTM().inverse())}
stage.addEventListener('wheel',e=>{e.preventDefault();const p=localPoint(e);zoom(e.deltaY>0?1.15:1/1.15,[p.x,p.y])},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,view:[...view],matrix:stage.querySelector('svg').getScreenCTM().inverse()};moved=false;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)moved=true;const m=drag.matrix;view=[drag.view[0]-dx*m.a-dy*m.c,drag.view[1]-dx*m.b-dy*m.d,drag.view[2],drag.view[3]];applyView()});
stage.addEventListener('pointerup',e=>{if(!drag)return;stage.releasePointerCapture(e.pointerId);drag=null;stage.classList.remove('dragging');if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-area]');if(el)choose(+el.dataset.area)}});
stage.addEventListener('pointercancel',()=>{drag=null;stage.classList.remove('dragging')});stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.area)choose(+e.target.dataset.area)});
$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('fit').onclick=()=>{view=[0,0,3200,2560];applyView()};$('level').onchange=filter;$('locale').onclick=()=>{locale=locale==='EN'?'RU':'EN';document.documentElement.lang=locale==='EN'?'en':'ru';init()};
$('search').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase(),xy=q.match(/^(\d+)\s*[:, ]\s*(\d+)$/);const c=DATA.cities.find(c=>xy?c.x===+xy[1]&&c.y===+xy[2]:q&&(c.name.toLowerCase().includes(q)||c.ru.toLowerCase().includes(q)||c.config_key===q));$('error').textContent=c?'':tr('No matching city. Use X:Y coordinates.','Город не найден. Введите X:Y.');if(c)choose(c.area_id,true)});
